<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiếu Trần | Personal Profile</title>
    <meta name="description" content="Personal profile of Hiếu Trần - FurryMC Developer">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="assets/background.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ video.
    </video>
    <div class="background-overlay"></div>

    <!-- Particles -->
    <div id="particles"></div>

    <!-- Main -->
    <main class="container">

        <!-- Profile Card -->
        <section class="profile-card">

            <!-- Avatar -->
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <img src="assets/avatar.png" alt="Hiếu Trần Avatar" class="avatar">
                <div class="online-status">
                    <span></span>
                    Online
                </div>
            </div>

            <!-- Name -->
            <h1 class="profile-name">
                AzureWolf VN
                <span class="verified">
                    <i class="fa-solid fa-check"></i>
                </span>
            </h1>

            <!-- Username -->
            <p class="username">
                @tr_hiu
            </p>

            <!-- Bio -->
            <p class="bio">
                🐺 Furry fursuit &nbsp;•&nbsp;
                🎮 Minecraft Dev &nbsp;•&nbsp;
                💻 Server Owner
            </p>

            <p class="bio-sub">
                Building worlds, creating experiences
                and working on something awesome. ✨
            </p>

            <!-- Social -->
            <div class="social-links">
                <a href="https://discord.gg/mhXyQzSPHc" target="_blank" class="social-button discord" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>

                <a href="https://github.com/trngtrunghieu70g1-stack" target="_blank" class="social-button github"
                    title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.facebook.com/share/1MKra5Gx7Y/?mibextid=wwXIfr" target="_blank"
                    class="social-button facebook" title="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="https://www.tiktok.com/@azure_wolf_vn" target="_blank" class="social-button tiktok"
                    title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- FurryMC Project Highlight -->
            <div class="project-card">
                <!-- Đã thay thế biểu tượng dấu chân bằng thẻ ảnh -->
                <div class="project-icon" style="padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                    <img src="assets/furrymc-logo.png" alt="FurryMC Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="project-info">
                    <h2>
                        FurryMC
                    </h2>
                    <p>
                        Minecraft Survival & Lands
                    </p>
                </div>
                <!-- Đã đổi sang trạng thái tạm tắt / coming soon và cập nhật domain furrymc.fun -->
                <a href="https://furrymc.fun/" target="_blank" class="project-button" style="opacity: 0.6; pointer-events: none;" title="Đang bảo trì / Tạm tắt">
                    Coming Soon
                    <i class="fa-solid fa-lock"></i>
                </a>
            </div>

            <!-- Music Player Card -->
            <div class="music-player-card">
                <div class="music-top-row">
                    <div class="music-icon-box" style="padding: 0; overflow: hidden;">
                        <img src="assets/music-cover.png" alt="Music Cover" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="music-meta">
                        <strong class="music-title">Fantasy</strong>
                        <span class="music-artist">Hưng Gấu</span>
                    </div>
                </div>

                <div class="music-progress-container" id="progressContainer">
                    <div class="music-progress-bar" id="progressBar"></div>
                </div>

                <div class="music-bottom-row">
                    <span class="music-time" id="musicTime">0:00 / 0:00</span>
                    <div class="music-controls">
                        <button id="prevBtn" class="player-btn" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                        <button id="playPauseBtn" class="player-btn main-play" title="Phát / Tạm dừng">
                            <i class="fa-solid fa-play" id="playPauseIcon"></i>
                        </button>
                        <button id="nextBtn" class="player-btn" title="Bài tiếp"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer>
                <p>
                    Made with
                    <span class="heart">♥</span>
                    by Azure Wolf
                </p>
                <span class="copyright">
                    © 2026 Hiếu Trần
                </span>
            </footer>

        </section>

    </main>


    <!-- Music -->
    <audio id="backgroundMusic" src="assets/music.mp3" loop></audio>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
